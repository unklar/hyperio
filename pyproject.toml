[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperio"
version = "0.3.0"
description = "Hyperspectral image I/O and processing with a NumPy-like HSI class"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Isaak Ihorst", email = "isaak.ihorst@uni-osnabrueck.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scikit-image>=0.22",
    "scikit-learn>=1.0",
    "scipy>=1.10",
    "spectral>=0.23",
    "tifffile>=2024.0.0",
    "rasterio>=1.3.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://github.com/hybrint/hyperio"
Documentation = "https://hyperio.readthedocs.io"
Repository = "https://github.com/hybrint/hyperio"
Issues = "https://github.com/hybrint/hyperio/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
